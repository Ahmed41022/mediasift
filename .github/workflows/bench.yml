name: Benchmark
on:
  workflow_dispatch:
    inputs:
      files:
        description: Number of files to generate
        default: "100000"
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Benchmark
        env:
          FILES: ${{ inputs.files || '100000' }}
        run: python -m benchmarks.bench_scan --files "$FILES" --output bench.json
      - name: Summary
        if: always()
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat bench.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: bench.json
          if-no-files-found: warn
