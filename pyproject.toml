[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mediasift"
version = "0.1.0.dev0"
description = "Find duplicate photos, videos and audio, and clean up safely: nothing is ever deleted directly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ahmed Ragab" }]
dependencies = [
  "click>=8.1",
  "numpy>=2.0",
  "pillow>=11.0",
  "platformdirs>=4.2",
  "rich>=13.7",
  "send2trash>=1.8.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
heic = ["pi-heif>=0.18"]
raw = ["rawpy>=0.23"]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pillow-heif>=0.18",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.8,<0.17",
]

[project.scripts]
mediasift = "mediasift.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mediasift"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF", "S110", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/mediasift/core/paths.py" = ["PTH"]
"src/mediasift/scan/*" = ["PTH"]
"src/mediasift/actions/*" = ["PTH"]
"tests/*" = ["PTH"]

[tool.mypy]
packages = ["mediasift"]
mypy_path = "src"
strict = true
warn_unreachable = false

[[tool.mypy.overrides]]
module = ["send2trash.*", "pi_heif.*", "pillow_heif.*", "rawpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = ["."]
markers = [
  "slow: takes more than a few seconds",
  "bench: performance benchmark, run in its own CI job",
  "realbin: uses the real Recycle Bin or Trash with temporary files",
  "ffmpeg: needs ffmpeg",
]
